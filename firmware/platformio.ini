; InnovaMesh firmware - PlatformIO project configuration.
; See CLAUDE.md for the build sequence and firmware/README.md for pin assignments.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	madhephaestus/ESP32Servo@^3.0.5
build_flags =
	-Wall

; The ESP-CAM is a second board that joins at build-sequence step 3 (image capture).
; Left commented until the camera is on the bench so `pio run` stays a single-target build.
;
; [env:esp32cam]
; platform = espressif32
; board = esp32cam
; framework = arduino
; monitor_speed = 115200
; board_build.partitions = huge_app.csv
